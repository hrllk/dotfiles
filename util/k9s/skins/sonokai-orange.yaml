# Sonokai "andromeda" for k9s, matching util/wezterm/wezterm.lua and
# util/tmux/.tmux.conf.
#
# The values are the xterm-256 entries the sonokai literals quantise to, not the
# literals themselves. k9s renders through tcell, which under TERM=tmux-256color
# quantises -- and gets it wrong for colours between palette entries (#F89860
# came out violet). Colours already on a palette entry pass through untouched.
# If you edit these, verify with a probe: set body.logoColor alone and read the
# SGR the ASCII logo is painted with.
#
# Backgrounds are `default` so the terminal background shows through; surfaces
# that must sit above content invert to #1C1C1C on orange instead.
k9s:
  body:
    fgColor: "#E4E4E4"
    bgColor: default
    logoColor: "#FF875F"
    logoColorMsg: "#E4E4E4"
    logoColorInfo: "#AFD75F"
    logoColorWarn: "#FFD75F"
    logoColorError: "#FF5F87"
  prompt:
    fgColor: "#E4E4E4"
    bgColor: default
    suggestColor: "#878787"
    border:
      command: "#FF875F"
      default: "#875F00"
  help:
    fgColor: "#E4E4E4"
    bgColor: default
    sectionColor: "#FF875F"
    keyColor: "#FF875F"
    numKeyColor: "#FFD75F"
  frame:
    title:
      fgColor: "#FF875F"
      bgColor: default
      highlightColor: "#FFFFFF"
      counterColor: "#878787"
      filterColor: "#FFD75F"
    border:
      # Same pair as tmux pane-border-style / pane-active-border-style.
      fgColor: "#875F00"
      focusColor: "#FF875F"
    menu:
      fgColor: "#E4E4E4"
      keyColor: "#FF875F"
      numKeyColor: "#FFD75F"
    crumbs:
      fgColor: "#1C1C1C"
      bgColor: "#FF875F"
      activeColor: "#FFFFFF"
    status:
      # Lifecycle colours carry data, not chrome -- left polychrome on purpose.
      newColor: "#5FD7FF"
      modifyColor: "#FFD75F"
      addColor: "#AFD75F"
      pendingColor: "#FF875F"
      errorColor: "#FF5F87"
      highlightColor: "#FF875F"
      killColor: "#AF87D7"
      completedColor: "#878787"
  info:
    sectionColor: "#878787"
    fgColor: "#FF875F"
  views:
    table:
      fgColor: "#E4E4E4"
      bgColor: default
      cursorFgColor: "#1C1C1C"
      cursorBgColor: "#FF875F"
      markColor: "#FFD75F"
      header:
        fgColor: "#878787"
        bgColor: default
        sorterColor: "#FF875F"
        selectedSortColumnColor: "#FFFFFF"
    xray:
      fgColor: "#E4E4E4"
      bgColor: default
      cursorColor: "#FF875F"
      cursorTextColor: "#1C1C1C"
      graphicColor: "#875F00"
    charts:
      bgColor: default
      dialBgColor: default
      chartBgColor: default
      focusFgColor: "#FFFFFF"
      focusBgColor: "#875F00"
      defaultDialColors:
        - "#FF875F"
        - "#FF5F87"
      defaultChartColors:
        - "#FF875F"
        - "#FF5F87"
      resourceColors:
        cpu:
          - "#FF875F"
          - "#875F00"
        mem:
          - "#FFD75F"
          - "#875F00"
    yaml:
      keyColor: "#FF875F"
      valueColor: "#E4E4E4"
      colonColor: "#878787"
    picker:
      mainColor: "#E4E4E4"
      focusColor: "#FF875F"
      shortcutColor: "#FFD75F"
    logs:
      fgColor: "#E4E4E4"
      bgColor: default
      indicator:
        fgColor: "#FF875F"
        bgColor: default
        toggleOnColor: "#AFD75F"
        toggleOffColor: "#878787"
  dialog:
    fgColor: "#E4E4E4"
    bgColor: default
    buttonFgColor: "#1C1C1C"
    buttonBgColor: "#875F00"
    buttonFocusFgColor: "#1C1C1C"
    buttonFocusBgColor: "#FF875F"
    labelFgColor: "#FF875F"
    fieldFgColor: "#E4E4E4"
