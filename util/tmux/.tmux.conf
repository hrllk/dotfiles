# tmux source-file ~/.tmux.conf
set-option -sa terminal-overrides ",xterm*:Tc"

# Test line to check if .tmux.conf is loaded on startup
# display-message "tmux.conf loaded!"

################
# options
################
set -s escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set-option -g mouse off
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g allow-rename off
set -g allow-set-title off
set -g automatic-rename off
set -g set-titles off

################
# plugins
################
# install prefix(ctrl + b) + ctrl + I
# TPM - Tmux Plugin Manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm' # pkg manager
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'

################
# plugin options: tmux-cpu
################
# set-option status-style bg=black
set -g status-right '#{cpu_fg_color} CU #{cpu_icon} #{cpu_percentage} #[fg=default]▸ MU #(~/.tmux/scripts/mem_real_macos.sh) '
set -g status-interval 2
# Direct macOS memory metric: active + wired (compressor excluded).
set -g status-left '#(TZ="Asia/Seoul" date +"%%y-%%m-%%d %%H:%%M")'

set -g @cpu_low_icon "󰁺"  # Low CPU usage
set -g @cpu_medium_icon "󰁾"  # Medium CPU usage
set -g @cpu_high_icon "󰁹"  # High CPU usage

# Escalation reads yellow -> red. Orange is deliberately absent here: it is the
# chrome accent, so a CPU spike must not borrow the colour that normally just
# means "this is the pane you are in".
set -g @cpu_low_fg_color "#[fg=#E1E3E4]"
set -g @cpu_medium_fg_color "#[fg=#EDC763]"
set -g @cpu_high_fg_color "#[fg=#FB617E]"
set -g @ram_low_fg_color "#[fg=#E1E3E4]"
set -g @ram_medium_fg_color "#[fg=#EDC763]"
set -g @ram_high_fg_color "#[fg=#FB617E]"

run-shell "$HOME/.local/share/tmux/plugins/tpm/tpm"


################
# style
################
# Sonokai "andromeda" literals, matching nvim's colorscheme and wezterm.lua:
#   orange #F89860  fg #E1E3E4  grey #7E8294  yellow #EDC763  red #FB617E
set -g status-style bg=default,fg=#E1E3E4
set -g status-position top
set -g status-justify centre
set -g status-left-length 20
set -g status-right-length 60
# Use the tmux 256-colour names here so message styling also works when the
# terminal does not advertise true-colour support. colour215 is the closest
# 256-palette neighbour of sonokai orange.
set -g message-style bg=colour234,fg=colour215
set -g message-command-style bg=colour234,fg=colour215
# Copy-mode selection uses the dim orange rather than a blue so that the one
# modal state in tmux stays inside the same two-colour system.
set -g mode-style "bg=#6B4226,fg=#E1E3E4"

set -g window-status-current-style fg=#F89860,bold
set -g window-status-style fg=#7E8294
# Two AI states share the window slot, and @ai_waiting outranks @ai_unread:
# a window that blocks on an answer needs the user more than a finished one.
# Both are plain foregrounds, so nothing paints over the background image.
#
# The states are white, not another hue: orange is now the resting colour of
# the whole status line, so a second warm tone would read as decoration rather
# than as a summons. Pushing the alert to the one thing orange cannot be --
# brighter than itself -- restores the contrast the old brick/amber pair had.
# Waiting is pure white and bold, done is a dimmer white; both outrank the
# #7E8294 grey of an idle window, so urgency maps onto lightness alone.
set -g window-status-current-format '#{?@ai_waiting,#[fg=#FFFFFF#,bold],#{?@ai_unread,#[fg=#D4D4D8],}} #I:#W #{?@ai_waiting,#[fg=#F89860#,bold],#{?@ai_unread,#[fg=#F89860#,bold],}}'
set -g window-status-format '#{?@ai_waiting,#[fg=#FFFFFF#,bold],#{?@ai_unread,#[fg=#D4D4D8],}} #I:#W #{?@ai_waiting,#[fg=#7E8294#,nobold],#{?@ai_unread,#[fg=#7E8294],}}'

# Shared by every AI agent hook (Codex, Claude Code) via
# ~/.tmux/scripts/ai-notify-hook.sh. Clear both states when the user reaches or
# refocuses the window: answering a prompt requires arriving here anyway. One
# hook per way of arriving, each clearing both flags, because the three are
# genuinely distinct events:
#
#   session-window-changed  the session's current window moved
#   client-session-changed  the client moved to a session that was already
#                           sitting on its target window, so nothing changed
#                           above it and the hook before never fired
#   client-focus-in         the terminal regained focus without navigating
#
# This replaces after-select-window, which covered only the first case.
# Reaching a flagged window through prefix + s left the mark set, and it
# resurfaced the moment the user navigated away again.
# Fixed hook slots keep this configuration idempotent and composable.
set-hook -g session-window-changed[99] 'set-option -wq @ai_unread 0 ; set-option -wq @ai_waiting 0'
set-hook -g client-session-changed[99] 'set-option -wq @ai_unread 0 ; set-option -wq @ai_waiting 0'
set-hook -g client-focus-in[99] 'set-option -wq @ai_unread 0 ; set-option -wq @ai_waiting 0'

set -g pane-active-border-style fg=#F89860
set -g pane-border-style fg=#6B4226
set -g pane-border-indicators off
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#{pane_index}: #{pane_title}"

################
# themes
################
# set -g @plugin 'catppuccin/tmux#latest'


################
## image.nvim configuration for tmux
################
set -gq allow-passthrough on
set -g visual-activity off


################
# bind: pane
################
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r h resize-pane -L 5
bind-key -r l resize-pane -R 5

bind-key S command-prompt -p "New Session Name:" "new-session -s '%%'"
# 이미 지정된 pane title 을 편집 모드로 프리필 (기본값인 hostname 도 그대로 프리필)
bind-key P command-prompt -I "#{pane_title}" -p "Pane title:" "select-pane -T '%%'"
bind-key J command-prompt -p "Target window index:" "join-pane -h -t ':%%'"

################
## copy-mode 
################
# bind -T copy-mode d send -X page-down
# bind -T copy-mode u send -X page-up
bind -T copy-mode 'C-d' send -X halfpage-down
bind -T copy-mode 'C-u' send -X halfpage-up

bind -T copy-mode h send -X cursor-left
bind -T copy-mode j send -X cursor-down
bind -T copy-mode k send -X cursor-up
bind -T copy-mode l send -X cursor-right


# use visual mode in copy-mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-on

bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Switch panes using Alt-h,j,k,l without prefix
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R
